"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000
add_newline = false

format = """
$username$hostname$directory$git_branch$git_status$line_break$character"""

[username]
show_always = true
format = '[$user]($style)'
style_user = 'bold green'
style_root = 'bold red'

[hostname]
ssh_only = true
format = '@[$hostname]($style):'
style = 'bold green'

[directory]
format = '[$path]($style) '
style = 'bold cyan'
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = '\([$branch]($style)'
style = 'bold purple'

[git_status]
format = '[$all_status$ahead_behind]($style)\) '
style = 'bold yellow'
conflicted = '!'
ahead = '^${count}'
behind = 'v${count}'
diverged = '^${ahead_count}v${behind_count}'
untracked = '?'
stashed = '$'
modified = '*'
staged = '+'
renamed = 'r'
deleted = 'd'

[character]
success_symbol = '[>](bold green)'
error_symbol = '[>](bold red)'

[package]
disabled = true

[memory_usage]
disabled = true
